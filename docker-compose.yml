services:
  # ============================================================================
  # 1. AoE2 Coach FastAPI Backend Gateway & ML Inference Engine
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aoe2-coach-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=4
      - LOG_LEVEL=info
      - LLM_BASE_URL=http://llama-server:8081/v1
      - LLM_MODEL=qwen3.8-4b
      - LLM_API_KEY=llama.cpp
      - LLM_TIMEOUT_SECONDS=4.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - coach-net

  # ============================================================================
  # 2. AoE2 Coach Next.js 15 Web Application Frontend
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: aoe2-coach-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - coach-net

  # ============================================================================
  # 3. Optional Local CPU LLM Inference Server (llama.cpp)
  # ============================================================================
  llama-server:
    image: ghcr.io/ggerganov/llama.cpp:server
    container_name: aoe2-coach-llama
    restart: unless-stopped
    ports:
      - "8081:8081"
    volumes:
      - ./models/gguf:/models:ro
    command:
      - "-m"
      - "/models/Qwen3.8-4B-Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8081"
      - "-c"
      - "2048"
      - "-t"
      - "8"
      - "--alias"
      - "qwen3.8-4b"
      - "-ngl"
      - "0"
    networks:
      - coach-net
    profiles:
      - full-local-llm

networks:
  coach-net:
    driver: bridge
