services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/aoe2-coach/backend:latest
    container_name: aoe2-coach-backend-prod
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - WORKERS=8
      - LOG_LEVEL=warning
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:8081/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3.8-4b}
      - LLM_API_KEY=${LLM_API_KEY:-llama.cpp}
      - LLM_TIMEOUT_SECONDS=3.0
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4096M
        reservations:
          cpus: "1.0"
          memory: 1024M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - coach-prod-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ghcr.io/aoe2-coach/frontend:latest
    container_name: aoe2-coach-frontend-prod
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NODE_ENV=production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2048M
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - coach-prod-net

networks:
  coach-prod-net:
    driver: bridge
