[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aoe2-coach"
version = "0.1.0"
description = "Age of Empires II: DE Real-Time Strategic & Tactical AI Coach"
authors = [{ name = "AoE2 Coach Team" }]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aoe2rec-py>=0.1.20",
    "mgz>=1.8.50",
    "pydantic>=2.10.0",
    "pyarrow>=18.0.0",
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "requests>=2.31.0",
    "websockets>=13.0.0",
    "numpy>=1.26.0",
    "pandas>=2.2.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "skl2onnx>=1.17.0",
    "scipy>=1.13.0",
    "joblib>=1.4.0",
    "httpx>=0.27.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "skore>=0.25.0",
    "ipython>=9.17.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aoe2_coach*"]

[tool.pytest.ini_options]
testpaths = ["aoe2_coach/tests"]
python_files = ["test_*.py"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
