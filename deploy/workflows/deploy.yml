name: Continuous Deployment (Cloud Run & Kubernetes)

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  deploy-cloudrun:
    name: Deploy to Google Cloud Run
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        if: env.GCP_SA_KEY != ''
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Deploy Backend to Cloud Run
        run: |
          echo "Deploying AoE2 Coach Backend to Cloud Run..."
          # gcloud run deploy aoe2-coach-backend --image=ghcr.io/${{ github.repository }}/backend:latest --region=us-central1

  deploy-kubernetes:
    name: Deploy to Kubernetes Cluster
    runs-on: ubuntu-latest
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Kubeconfig
        if: env.KUBECONFIG_DATA != ''
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG_DATA }}
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG_DATA }}" | base64 -d > ~/.kube/config

      - name: Apply Kubernetes Kustomization
        run: |
          kubectl kustomize k8s/ | kubectl apply -f - || true
