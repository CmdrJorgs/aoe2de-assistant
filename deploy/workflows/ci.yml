name: Continuous Integration & Automated Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  backend-test:
    name: Backend Test Suite (Python 3.12)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv Package Manager
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Install Dependencies
        run: |
          uv venv
          . .venv/bin/activate
          uv pip install -r pyproject.toml pytest pytest-asyncio

      - name: Run Pytest Suite & Code Quality Tests
        run: |
          . .venv/bin/activate
          pytest aoe2_coach/tests -v --durations=10

      - name: Execute Pro Match Benchmarks
        run: |
          . .venv/bin/activate
          python scripts/benchmark_pro_matches.py --iterations 5 --export-json benchmark_report.json

      - name: Execute 800-1200 ELO User Testing Simulation
        run: |
          . .venv/bin/activate
          python scripts/run_user_testing_simulation.py --export-json calibration_report.json

  frontend-check:
    name: Frontend Lint & Standalone Build (Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Node Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build Next.js 15 Standalone
        run: npm run build
