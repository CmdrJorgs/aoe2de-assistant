apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aoe2-coach-frontend
  labels:
    cloud.googleapis.com/location: us-central1
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "6"
        run.googleapis.com/startup-cpu-boost: "true"
    spec:
      containerConcurrency: 100
      containers:
        - image: gcr.io/aoe2-coach-prod/frontend:latest
          ports:
            - name: http1
              containerPort: 3000
          resources:
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: NODE_ENV
              value: "production"
            - name: NEXT_PUBLIC_API_URL
              value: "https://api.aoe2coach.ai"
